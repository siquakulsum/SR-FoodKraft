<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - SR Food Kraft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .offline-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }

        .offline-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: #fef3c7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
        }

        .offline-title {
            font-size: 28px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 15px;
        }

        .offline-message {
            font-size: 16px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .retry-button {
            background: #fbbf24;
            color: #1f2937;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 15px;
        }

        .retry-button:hover {
            background: #f59e0b;
            transform: translateY(-2px);
        }

        .home-button {
            background: transparent;
            color: #6b7280;
            border: 2px solid #e5e7eb;
            padding: 13px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .home-button:hover {
            border-color: #fbbf24;
            color: #fbbf24;
        }

        .connection-status {
            margin-top: 30px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            font-size: 14px;
            color: #6b7280;
        }

        .online {
            background: #d1fae5;
            color: #065f46;
        }

        .offline {
            background: #fee2e2;
            color: #991b1b;
        }

        @media (max-width: 480px) {
            .offline-container {
                padding: 30px 20px;
            }

            .offline-title {
                font-size: 24px;
            }

            .retry-button,
            .home-button {
                display: block;
                width: 100%;
                margin: 10px 0;
            }
        }
    </style>
</head>

<body>
    <div class="offline-container">
        <div class="offline-icon">
            📱
        </div>

        <h1 class="offline-title">You're Offline</h1>

        <p class="offline-message">
            It looks like you're not connected to the internet. Don't worry!
            You can still browse some of our content that we've saved for you.
        </p>

        <div>
            <button class="retry-button" onclick="retryConnection()">
                Try Again
            </button>
            <button class="home-button" onclick="goHome()">
                Go to Home
            </button>
        </div>

        <div class="connection-status offline" id="connectionStatus">
            🔴 No Internet Connection
        </div>
    </div>

    <script>
        // Check connection status
        function updateConnectionStatus() {
            const statusElement = document.getElementById('connectionStatus');

            if (navigator.onLine) {
                statusElement.textContent = '🟢 Connected to Internet';
                statusElement.className = 'connection-status online';
            } else {
                statusElement.textContent = '🔴 No Internet Connection';
                statusElement.className = 'connection-status offline';
            }
        }

        // Retry connection
        function retryConnection() {
            if (navigator.onLine) {
                window.location.reload();
            } else {
                // Show a brief message
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = 'Still Offline...';
                button.style.background = '#ef4444';

                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#fbbf24';
                }, 2000);
            }
        }

        // Go to home page
        function goHome() {
            window.location.href = '/';
        }

        // Listen for online/offline events
        window.addEventListener('online', () => {
            updateConnectionStatus();
            // Auto-reload when back online
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });

        window.addEventListener('offline', updateConnectionStatus);

        // Initial status check
        updateConnectionStatus();

        // Periodic connection check
        setInterval(updateConnectionStatus, 5000);
    </script>
</body>

</html>
